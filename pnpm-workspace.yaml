packages:
  - "apps/*"
  - "packages/*"
  - "internal-packages/*"
  - "presets/*"
  - "plugins/*"
  - "!examples/**"

allowBuilds:
  "@tailwindcss/oxide": true
  contentlayer2: true
  core-js: true
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  rclone.js: true
  sharp: true
  simple-git-hooks: true
  workerd: true

# The Presentation 4 preview packages currently reference each other by pkg.pr.new URL.
blockExoticSubdeps: false

catalog:
  typescript: 7.0.2
  "@tsdown/css": 0.22.14
  tsdown: 0.22.14
  vitest: 4.1.10
  next: 16.3.0
  vite: 8.2.1
  "@types/node": 22.20.1
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.4
  react-iiif-vault: https://pkg.pr.new/digirati-co-uk/react-iiif-vault/react-iiif-vault@575a0d7
  react: 19.2.8
  react-dom: 19.2.8
  styled-components: 6.1.8
  zustand: 4.5.2
  "@iiif/parser": https://pkg.pr.new/IIIF-Commons/parser/@iiif/parser@8dd1762
  "@iiif/helpers": https://pkg.pr.new/IIIF-Commons/iiif-helpers/@iiif/helpers@e12c127
  # "iiif-browser": 2.2.4
  iiif-browser: https://pkg.pr.new/digirati-co-uk/iiif-browser/iiif-browser@4934ee2
  "@atlas-viewer/atlas": 3.2.3
  "react-aria-components": ^1.12

minimumReleaseAgeExclude:
  - syncpack-darwin-arm64@15.3.3
  - syncpack-darwin-x64@15.3.3
  - syncpack-linux-arm64-musl@15.3.3
  - syncpack-linux-arm64@15.3.3
  - syncpack-linux-x64-musl@15.3.3
  - syncpack-linux-x64@15.3.3
  - syncpack-windows-arm64@15.3.3
  - syncpack-windows-x64@15.3.3
  - syncpack@15.3.3

overrides:
  "@atlas-viewer/atlas": 3.2.3
  react-aria: 3.43.2
  react-aria-components: 1.12.1
  react-reconciler: 0.33.0
